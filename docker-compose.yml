services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: workoutapp
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: workoutapp
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    # The backend waits for this before starting (see depends_on below). Without it,
    # depends_on only waits for the container to start, not for Postgres to accept connections.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workoutapp -d workoutapp"]
      interval: 2s
      timeout: 3s
      retries: 15

  backend:
    build: ./backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    # Supplies JWT_SECRET from backend/.env (not committed). Values under environment: take precedence.
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgres://workoutapp:devpassword@postgres:5432/workoutapp
    # The backend runs migrations on startup (see backend/Dockerfile), so the database must be ready.
    depends_on:
      postgres:
        condition: service_healthy

  # Throwaway database for backend tests: `docker compose up -d postgres-test`.
  # The "test" profile keeps it out of a plain `docker compose up`. Data lives in RAM (tmpfs)
  # and is wiped when the container stops; the test run applies the migrations itself.
  postgres-test:
    image: postgres:16
    profiles: ["test"]
    environment:
      POSTGRES_USER: workoutapp
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: workoutapp_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workoutapp -d workoutapp_test"]
      interval: 2s
      timeout: 3s
      retries: 15

  # Runs the backend tests on Linux: `npm test` in backend/ (docker compose run --rm --build
  # backend-test). On Windows, Vitest workers crash intermittently (0xC0000409, see the roadmap's
  # Known issues); Linux doesn't have that crash. Extra arguments go to Vitest
  # (`npm test -- test/templates.test.ts`), because they replace the empty command after the
  # entrypoint.
  backend-test:
    build:
      context: ./backend
      target: test
    profiles: ["test"]
    entrypoint: ["npx", "vitest", "run"]
    environment:
      # Read by test/test-env.ts. Inside the Compose network the test DB is postgres-test:5432
      # (5433 is only its port on the host).
      TEST_DATABASE_URL: postgres://workoutapp:devpassword@postgres-test:5432/workoutapp_test
    # The source, read-only, one folder or file at a time. Mounting all of backend/ would cover
    # the image's Linux node_modules with Windows' (bcrypt's native module wouldn't load).
    volumes:
      - ./backend/src:/app/src:ro
      - ./backend/test:/app/test:ro
      - ./backend/migrations:/app/migrations:ro
      - ./backend/package.json:/app/package.json:ro
      - ./backend/tsconfig.json:/app/tsconfig.json:ro
      - ./backend/vitest.config.mts:/app/vitest.config.mts:ro
    depends_on:
      postgres-test:
        condition: service_healthy

volumes:
  pgdata: